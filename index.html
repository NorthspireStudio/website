<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northspire Studio</title>
<style>
  :root { --bg: #ffffff; --text: #1d2026; --dim: #5b616b; --line: #e3e6ea; --accent: #1a73b8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171a20; --text: #e4e7ec; --dim: #9aa0aa; --line: #2d323b; --accent: #7cc8ff; }
  }
  html { background: var(--bg); }
  body { margin: 0 auto; max-width: 720px; padding: 48px 16px 64px; color: var(--text);
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 2rem; margin: 0 0 4px; }
  h2 { font-size: 1.2rem; margin: 0 0 4px; }
  .dim { color: var(--dim); margin-top: 0; }
  .app { border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; margin: 32px 0; }
  a { color: var(--accent); }
</style>
</head>
<body>
<h1>Northspire Studio</h1>
<p class="dim">Independent apps and games.</p>

<div class="app">
  <h2>RemoteTV</h2>
  <p class="dim">A TV remote for Android phones. Control Android TV, Google TV, Samsung, LG, Roku, Vizio and Fire TV over Wi-Fi, or almost any TV with the phone's IR blaster.</p>
  <p><a href="remotetv/privacy.html">Privacy policy</a></p>
</div>

<p>Contact: <a href="mailto:contact@northspirestudio.com">contact@northspirestudio.com</a></p>
</body>
</html>
